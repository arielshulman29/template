# DEVELOPMENT ONLY: a throwaway Postgres for your laptop.
# - The password is in plain text and the data lives in a local Docker volume.
# - db/init.sql seeds sample rows the first time the volume is empty.
# In production the server connects to a managed database (its DATABASE_URL is
# set by the hosting platform), and schema changes go through migrations.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: rooms
      POSTGRES_PASSWORD: rooms
      POSTGRES_DB: rooms
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rooms"]
      interval: 2s
      retries: 15

volumes:
  db-data:
